[test]
# Runs before every test file. Guards TEST_DATABASE_URL so the destructive
# integration suites can never truncate a real database — see test-setup.ts.
preload = ["./test-setup.ts"]

# Process Tailwind CSS when the one-port dev launcher (scripts/dev.ts) bundles
# the web app. Same plugin as apps/web/bunfig.toml, which covers `dev:web`.
[serve.static]
plugins = ["bun-plugin-tailwind"]
